<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFC000"/>
      <stop offset="100%" style="stop-color:#E6B800"/>
    </linearGradient>
    <linearGradient id="micHeadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE44D"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#D4A800"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1E1E1E" opacity="0.5"/>
  
  <!-- Mic stand base -->
  <ellipse cx="100" cy="175" rx="30" ry="8" fill="url(#goldGradient)" opacity="0.8"/>
  <rect x="95" y="140" width="10" height="40" fill="url(#goldGradient)" rx="2"/>
  
  <!-- Mic connector -->
  <rect x="90" y="130" width="20" height="15" fill="url(#goldGradient)" rx="3"/>
  
  <!-- Mic body -->
  <ellipse cx="100" cy="115" rx="25" ry="35" fill="url(#goldGradient)" filter="url(#glow)"/>
  
  <!-- Mic head (grille area) -->
  <ellipse cx="100" cy="70" rx="35" ry="40" fill="url(#micHeadGradient)" filter="url(#glow)"/>
  
  <!-- Grille lines -->
  <g stroke="#B8860B" stroke-width="1" opacity="0.4">
    <line x1="100" y1="30" x2="100" y2="110"/>
    <line x1="65" y1="35" x2="135" y2="35"/>
    <line x1="65" y1="50" x2="135" y2="50"/>
    <line x1="65" y1="65" x2="135" y2="65"/>
    <line x1="65" y1="80" x2="135" y2="80"/>
    <line x1="65" y1="95" x2="135" y2="95"/>
  </g>
  
  <!-- Diagonal grille lines -->
  <g stroke="#B8860B" stroke-width="1" opacity="0.3">
    <line x1="70" y1="35" x2="85" y2="110"/>
    <line x1="130" y1="35" x2="115" y2="110"/>
    <line x1="70" y1="95" x2="90" y2="30"/>
    <line x1="130" y1="95" x2="110" y2="30"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="100" cy="70" r="8" fill="#FFF8DC" opacity="0.9"/>
  <circle cx="100" cy="70" r="5" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Shine highlight -->
  <ellipse cx="85" cy="50" rx="10" ry="15" fill="#FFFFFF" opacity="0.2"/>
</svg>
